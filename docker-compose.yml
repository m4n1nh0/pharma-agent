version: "3.9"

services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pharma-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pharma-api
    command: uvicorn src.presentation.api.app:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      EMBEDDED_WORKER: "false"   
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build: .
    container_name: pharma-worker
    command: python -m src.presentation.worker.consumer
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    deploy:
      replicas: 2     

volumes:
  rabbitmq_data:
